name: Shell validation
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout exact PR head
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Parse every tracked Bash entrypoint
      shell: bash
      run: |-
        set -euo pipefail
        mapfile -d '' files < <(git ls-files -z -- '*.sh' '*.tmux')
        (( ${#files[@]} > 0 ))
        for file in "${files[@]}"; do
          printf 'Checking %s\n' "$file"
          bash -n "$file"
        done
